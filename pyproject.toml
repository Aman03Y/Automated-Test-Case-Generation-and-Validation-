[project]
name = "ai-testcase-validator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aman", email = "amanyadav1240@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.0",
    "nltk>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pymupdf>=1.23.0",
    "pytest>=8.0.0",
    "python-docx>=1.0.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.5.0",
    "reportlab>=5.0.1",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=3.0.0",
    "spacy>=3.7.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-testcase-validator = "ai_testcase_validator:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
