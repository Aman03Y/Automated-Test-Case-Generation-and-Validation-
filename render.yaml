services:
  - type: web
    name: ai-testcase-validator-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: LOG_LEVEL
        value: WARNING
      - key: TOKENIZERS_PARALLELISM
        value: "false"
